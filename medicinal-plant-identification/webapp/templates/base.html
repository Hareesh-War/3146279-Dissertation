<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Medicinal Plant ID{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>MP</text></svg>">
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">MediPlant ID</a>
            <div class="nav-links">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Identify</a>
                <a href="/species" class="nav-link {% if '/species' in request.path %}active{% endif %}">Species</a>
                <a href="/history" class="nav-link {% if request.path == '/history' %}active{% endif %}">History</a>
                <a href="/about" class="nav-link {% if request.path == '/about' %}active{% endif %}">About</a>
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>Medicinal Plant Identification System | BSc Dissertation | University of Stirling</p>
        <p class="footer-small">Sequential Transfer Learning | Hari (3146279) | Supervisor: Dr. Shamik Palit</p>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
